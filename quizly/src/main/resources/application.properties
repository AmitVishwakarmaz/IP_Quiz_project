spring.application.name=Quizly
spring.config.import=optional:file:./config/credentials.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_platform?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

app.auth.instructor-invite-code=${INSTRUCTOR_INVITE_CODE:}